<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/MordecAI-logo-box.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mordecai</title>
  </head>
  <body>
    <!-- Netlify form detection -->

<form
  name="business-check"
  netlify
  hidden
>
  <input
    type="text"
    name="businessName"
  />

  <input
    type="text"
    name="website"
  />

  <input
    type="text"
    name="score"
  />

  <input
    type="text"
    name="grade"
  />
</form>

<form
  name="contact"
  netlify
  netlify-honeypot="bot-field"
  hidden
>
  <input
    type="text"
    name="name"
  />

  <input
    type="text"
    name="businessName"
  />

  <input
    type="text"
    name="contact"
  />

  <input
    type="text"
    name="service"
  />

  <textarea
    name="message"
  ></textarea>

  <input
    type="text"
    name="bot-field"
  />
</form>

<div id="root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
